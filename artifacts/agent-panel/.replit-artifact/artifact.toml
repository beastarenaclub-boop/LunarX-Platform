kind = "web"
previewPath = "/agent/"
title = "Agent Panel"
version = "1.0.0"
id = "artifacts/agent-panel"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/agent/" ]
localPort = 21770

[services.development]
run = "pnpm --filter @workspace/agent-panel run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/agent-panel", "run", "build" ]
publicDir = "artifacts/agent-panel/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21770"
BASE_PATH = "/agent/"
