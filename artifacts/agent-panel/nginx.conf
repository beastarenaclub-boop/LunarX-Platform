server {
  listen 80;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;
  location = /healthz { default_type text/plain; return 200 "ok\n"; }
  location = / { return 302 /agent/; }
  location = /master { return 301 /master/; }
  location = /agent { return 301 /agent/; }
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /ws {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
  location /agent/ { rewrite ^/agent/(.*)$ /$1 break; try_files $uri $uri/ /index.html; }
  location /master/ { rewrite ^/master/(.*)$ /$1 break; try_files $uri $uri/ /index.html; }
}
