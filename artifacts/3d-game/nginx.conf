server {
    listen 80;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    # Always obtain the current entrypoint after deploying a new game bundle.
    # Hashed assets keep their own caching behavior.
    location = /index.html {
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location = /unity-sports/ready.json {
        default_type application/json;
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }

    location = /unity-sports/index.html {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }

    location /unity-sports/ {
        # Keep missing Unity binaries out of the SPA HTML fallback.
        types { application/wasm wasm; application/javascript js; application/octet-stream data; }
        gzip_types application/wasm application/octet-stream application/javascript;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /unity-horse/ {
        types { text/html html; application/json json; application/wasm wasm; application/javascript js; application/octet-stream data; }
        gzip_types application/wasm application/octet-stream application/javascript;
        try_files $uri =404;
    }

    # Studio assets must return real media or an error, never the SPA HTML.
    # These filenames are stable, so validate cached responses on each visit.
    location /media/baccarat/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /virtual-sports/audio/ {
        types { audio/ogg ogg; audio/mpeg mp3; application/json json; text/plain txt; }
        try_files $uri =404;
    }

    # Explicit recovery for stale game artwork. Keep cookies and storage intact.
    location = /jetx-refresh {
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Clear-Site-Data '"cache"' always;
        return 302 /jetx?design=reference-v6;
    }

    # Vite gives these public video/poster files a content hash. Keep complete
    # responses and byte ranges reusable by native media players between loops.
    location ~ ^/assets/asha-(continuous-studio|natural|cinema)-.*\.(mp4|webm|jpg)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ ^/assets/studio-v[23]-.*\.(mp4|webm|mp3|jpg)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /ws {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /launch {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /horse-riding {
        return 301 /horse-riding/;
    }

    location /horse-riding/ {
        try_files $uri $uri/ /horse-riding/index.html;
    }
}
