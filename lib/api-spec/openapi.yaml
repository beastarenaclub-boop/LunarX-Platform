openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Platform API — auth, wallet, KYC, admin, audit.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: profile
  - name: wallet
  - name: kyc
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create a new player account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/demo-login:
    post:
      operationId: demoLogin
      tags: [auth]
      summary: Create an ephemeral demo player and log in
      description: |
        Creates a fresh ephemeral demo player account, credits a starter
        virtual balance, opens a session, and returns the new user. No
        request body required.
      responses:
        "200":
          description: Demo session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out the current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }

  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request a password reset token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "200":
          description: Token issued (returned in dev for testability)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordResetIssued" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [auth]
      summary: Confirm password reset using token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetConfirm" }
      responses:
        "200":
          description: Reset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }
        "400": { $ref: "#/components/responses/Error" }

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get own profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Error" }

  /wallet/balance:
    get:
      operationId: getWalletBalance
      tags: [wallet]
      summary: Read own wallet balance for a single game
      parameters:
        - in: query
          name: game
          description: >
            Which game's separate wallet to read (lunar | mines | plinko | dice).
            Defaults to lunar. Each game has a fully independent balance.
          schema:
            type: string
            enum: [lunar, mines, plinko, dice, aviator, jetx, fury, horse-racing, bike-racing, roulette, baccarat, blackjack, teen-patti, teen-patti-live, sic-bo, andar-bahar, lucky-7]
            default: lunar
      responses:
        "200":
          description: Balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalletBalance" }
        "401": { $ref: "#/components/responses/Error" }

  /wallet/balances:
    get:
      operationId: getWalletBalances
      tags: [wallet]
      summary: Read shared wallet balance through legacy game aliases
      responses:
        "200":
          description: Per-game balances
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalletBalances" }
        "401": { $ref: "#/components/responses/Error" }

  /wallet/transactions:
    get:
      operationId: listWalletTransactions
      tags: [wallet]
      summary: List own wallet ledger entries for a single game
      parameters:
        - in: query
          name: game
          description: Which game's wallet ledger to read (lunar | mines | plinko | dice). Defaults to lunar.
          schema:
            type: string
            enum: [lunar, mines, plinko, dice, aviator, jetx, fury, horse-racing, bike-racing, roulette, baccarat, blackjack, teen-patti, teen-patti-live, sic-bo, andar-bahar, lucky-7]
            default: lunar
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalletTransactionsPage" }
        "401": { $ref: "#/components/responses/Error" }

  /kyc/uploads/{filename}:
    put:
      operationId: uploadKycDocument
      tags: [kyc]
      summary: Upload a KYC document (raw binary body) and receive a storage key
      description: >
        Authenticated raw-body upload for ID/selfie documents. The request
        body is the raw file bytes (NOT a JSON-wrapped Blob); the typed
        client (`uploadKycDocument`) forwards a `Blob`/`ArrayBuffer`/`Buffer`
        directly. The server stores the bytes under a server-issued key of
        the form `<userId>/<name>` and returns it. Pass that `key` as
        `idDocumentKey` / `selfieKey` to `POST /kyc`.
      parameters:
        - in: path
          name: filename
          required: true
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycUploadResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }

  /kyc/uploads/{userId}/{name}/object:
    get:
      operationId: getKycUpload
      tags: [admin]
      summary: Fetch a previously uploaded KYC document (admin)
      description: >
        Returns the raw bytes of an uploaded KYC document. The composite
        path (`userId` + `name`) reproduces the stored key
        (`<userId>/<name>`) using two explicit path segments to avoid
        ambiguous URL encoding of slashes.
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /kyc:
    get:
      operationId: getMyKyc
      tags: [kyc]
      summary: Get own latest KYC submission
      responses:
        "200":
          description: KYC submission or null
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycSubmissionOrNull" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: submitKyc
      tags: [kyc]
      summary: Submit a KYC application
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KycSubmissionInput" }
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycSubmission" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /admin/kyc:
    get:
      operationId: adminListKyc
      tags: [admin]
      summary: List KYC submissions (admin)
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: Submissions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/KycSubmission" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /admin/kyc/{id}/review:
    post:
      operationId: adminReviewKyc
      tags: [admin]
      summary: Approve or reject a KYC submission
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KycReviewInput" }
      responses:
        "200":
          description: Reviewed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycSubmission" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /payments/deposit-limits:
    get:
      operationId: getDepositLimits
      tags: [wallet]
      summary: Get the current min and max deposit amounts for players
      responses:
        "200":
          description: Limits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositLimits" }
        "401": { $ref: "#/components/responses/Error" }

  /payments/deposit-settings:
    get:
      operationId: getDepositSettingsPublic
      tags: [wallet]
      summary: Get current deposit method availability and limits for players
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositSettingsPublic" }
        "401": { $ref: "#/components/responses/Error" }

  /payments/coin-packs:
    get:
      operationId: listCoinPacks
      tags: [wallet]
      summary: List the coin packs on sale for one game's wallet
      description: |
        Server-owned catalog of ten coin packs. Coins are 1:1 with rupees and
        every pack is worth ten bets at its matching chip denomination
        (`coins = chipValue * 10`). Clients select a `sku` — they never send a
        price; the server prices the SKU from this catalog and rejects any
        deposit whose amount does not match.
      parameters:
        - in: query
          name: game
          required: false
          schema: { $ref: "#/components/schemas/GameScope" }
          description: Which game's wallet the packs credit. Defaults to lunar.
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CoinPack" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /payments/deposits:
    get:
      operationId: listMyDeposits
      tags: [wallet]
      summary: List my deposit requests
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PaymentRequest" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createDepositRequest
      tags: [wallet]
      summary: Create a pending deposit request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DepositRequestInput" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /payments/deposits/{id}:
    delete:
      operationId: cancelMyDeposit
      tags: [wallet]
      summary: Cancel my own pending deposit request
      description: |
        Allows a player to cancel a deposit request they submitted by mistake,
        as long as it has not yet been processed (status `pending` or
        `gateway_pending`). Transitions the request to `cancelled` and writes
        an audit entry.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /payments/deposits/auto:
    post:
      operationId: createAutoDepositRequest
      tags: [wallet]
      summary: Create a pending auto-deposit request (gateway mode)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutoDepositInput" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoDepositResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /payments/upi-accounts:
    get:
      operationId: listActiveUpiAccounts
      tags: [wallet]
      summary: List active admin-managed UPI accounts for deposits
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicUpiAccount" }
        "401": { $ref: "#/components/responses/Error" }

  /payments/upi-accounts/qr/{prefix}/{name}:
    get:
      operationId: getUpiAccountQr
      tags: [wallet]
      summary: Fetch the raw QR image bytes for an admin-managed UPI account
      parameters:
        - in: path
          name: prefix
          required: true
          schema: { type: string }
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /payments/gateway-webhook:
    post:
      operationId: gatewayWebhook
      tags: [payments]
      summary: Stub payment gateway webhook callback (auto-credits on success)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GatewayWebhookInput" }
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
        "401": { $ref: "#/components/responses/Error" }

  /payments/withdraw-limits:
    get:
      operationId: getWithdrawLimits
      tags: [wallet]
      summary: Get the current min and max withdrawal amounts for players
      responses:
        "200":
          description: Limits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WithdrawLimits" }
        "401": { $ref: "#/components/responses/Error" }

  /payments/withdrawals/{id}:
    delete:
      operationId: cancelMyWithdrawal
      tags: [wallet]
      summary: Cancel my own pending withdrawal request
      description: |
        Allows a player to cancel a withdrawal request they submitted by
        mistake, as long as it has not yet been processed (status `pending`).
        Transitions the request to `cancelled` and writes an audit entry.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /payments/withdrawals:
    get:
      operationId: listMyWithdrawals
      tags: [wallet]
      summary: List my withdrawal requests
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PaymentRequest" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createWithdrawRequest
      tags: [wallet]
      summary: Create a pending withdrawal request (KYC-gated)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WithdrawRequestInput" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /bets:
    get:
      operationId: listMyBets
      tags: [wallet]
      summary: List my bet history
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200":
          description: Bets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BetsPage" }
        "401": { $ref: "#/components/responses/Error" }

  /bets/place:
    post:
      operationId: placeBet
      tags: [wallet]
      summary: Place a bet (debits wallet)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaceBetInput" }
      responses:
        "200":
          description: Placed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bet" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /bets/{id}/cashout:
    post:
      operationId: cashOutBet
      tags: [wallet]
      summary: Cash out a placed bet (credits wallet)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CashOutInput" }
      responses:
        "200":
          description: Cashed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bet" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /bets/{id}/lose:
    post:
      operationId: settleBetLoss
      tags: [wallet]
      summary: Mark a placed bet as lost (no wallet movement; stake was already debited)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettleLossInput" }
      responses:
        "200":
          description: Settled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bet" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /free-bets:
    get:
      operationId: getFreeBets
      tags: [promotions]
      summary: My active promotional free bets
      parameters:
        - in: query
          name: gameCode
          schema: { type: string }
      responses:
        "200":
          description: Free bets summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FreeBetsSummary" }
        "401": { $ref: "#/components/responses/Error" }

  /rain/active:
    get:
      operationId: getActiveRain
      tags: [promotions]
      summary: Currently claimable rain drop (if any)
      parameters:
        - in: query
          name: gameCode
          schema: { type: string }
      responses:
        "200":
          description: Active rain
          content:
            application/json:
              schema:
                type: object
                required: [rain]
                properties:
                  rain:
                    oneOf:
                      - { $ref: "#/components/schemas/RainEvent" }
                      - { type: "null" }
        "401": { $ref: "#/components/responses/Error" }

  /rain/{id}/claim:
    post:
      operationId: claimRain
      tags: [promotions]
      summary: Claim a rain drop (first-come-first-served free bet)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Claimed
          content:
            application/json:
              schema:
                type: object
                required: [grant, rain]
                properties:
                  grant: { $ref: "#/components/schemas/FreeBetGrant" }
                  rain: { $ref: "#/components/schemas/RainEvent" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /admin/free-bets:
    post:
      operationId: adminGrantFreeBets
      tags: [admin]
      summary: Grant promotional free bets to a player
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminGrantFreeBetsInput" }
      responses:
        "200":
          description: Granted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FreeBetGrant" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    get:
      operationId: adminListFreeBets
      tags: [admin]
      summary: List free-bet grants
      parameters:
        - in: query
          name: userId
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Grants
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/FreeBetGrant" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /admin/rain:
    post:
      operationId: adminCreateRain
      tags: [admin]
      summary: Trigger a manual rain drop in chat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCreateRainInput" }
      responses:
        "200":
          description: Rain created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RainEvent" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /kyc/history:
    get:
      operationId: getKycHistory
      tags: [kyc]
      summary: Get all KYC submissions for the current user
      responses:
        "200":
          description: KYC submissions
          content:
