  /admin/fraud/scan:
    post:
      operationId: adminRunFraudScan
      tags: [admin]
      summary: Run multi-account detection scan
      responses:
        "200":
          description: Scan result
          content:
            application/json:
              schema:
                type: object
                required: [flagged]
                properties:
                  flagged: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /game/config/{gameCode}:
    get:
      operationId: getGameConfig
      tags: [admin]
      summary: Get game RTP configuration
      parameters:
        - in: path
          name: gameCode
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameConfig" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateGameConfig
      tags: [admin]
      summary: Update game RTP configuration (requires step-up)
      parameters:
        - in: path
          name: gameCode
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GameConfigUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameConfig" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /game/rounds:
    get:
      operationId: listGameRounds
      tags: [game]
      summary: List recent game rounds
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Rounds
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GameRoundSummary" }

  /game/rounds/{id}/verify:
    get:
      operationId: verifyGameRound
      tags: [game]
      summary: Verify a specific round is provably fair
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoundVerification" }
        "404": { $ref: "#/components/responses/Error" }

  /admin/dashboard:
    get:
      operationId: adminDashboard
      tags: [admin]
      summary: Operator overview metrics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDashboard" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /demo-nudge/event:
    post:
      operationId: recordDemoNudgeEvent
      tags: [demoNudge]
      summary: Record a demo signup nudge impression, click, or conversion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DemoNudgeEventInput" }
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /demo-nudge/admin/stats:
    get:
      operationId: adminDemoNudgeStats
      tags: [admin, demoNudge]
      summary: Per-trigger conversion stats for demo signup nudges
      parameters:
        - in: query
          name: days
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoNudgeStats" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
    SignupRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128 }
        displayName: { type: string, maxLength: 64 }
        referralCode: { type: string, maxLength: 32 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 128 }
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    PasswordResetIssued:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        token:
          type: string
          description: Returned in non-production for testability. In production this is delivered out of band.
    PasswordResetConfirm:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, minLength: 8, maxLength: 128 }
    UserPublic:
      type: object
      required: [id, email, role, status, createdAt]
      properties:
        id: { type: string }
        email: { type: string }
        role:
          type: string
          enum: [player, agent, support, admin, super_admin]
        status:
          type: string
          enum: [active, suspended, banned, pending]
        displayName: { type: string, nullable: true }
        referralCode: { type: string, nullable: true }
        isDemo:
          type: boolean
          description: True for ephemeral demo player accounts created via /auth/demo-login.
        createdAt: { type: string, format: date-time }
    AuthResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/UserPublic" }
    Me:
      $ref: "#/components/schemas/UserPublic"
    Profile:
      $ref: "#/components/schemas/UserPublic"
    WalletBalance:
      type: object
      required: [walletId, currency, scope, balance]
      properties:
        walletId: { type: string }
        currency: { type: string }
        scope:
          type: string
          enum: [lunar, mines, plinko, dice, aviator, jetx, fury, horse-racing, bike-racing, roulette, baccarat, blackjack, teen-patti, teen-patti-live, sic-bo, andar-bahar, lucky-7]
          description: Which game this wallet belongs to.
        balance:
          type: string
          description: Balance in smallest currency unit (paise) as a string for bigint safety.
    WalletBalances:
      type: object
      required: [currency, balances]
      properties:
        currency: { type: string }
        balances:
          type: object
          required: [lunar, mines, plinko, dice, aviator, jetx, fury, horse-racing, bike-racing, roulette, baccarat, blackjack, teen-patti, teen-patti-live, sic-bo, andar-bahar, lucky-7]
          description: Per-game balances in paise as strings, keyed by game scope.
          properties:
            lunar: { type: string }
            mines: { type: string }
            plinko: { type: string }
            dice: { type: string }
            aviator: { type: string }
            jetx: { type: string }
            fury: { type: string }
            horse-racing: { type: string }
            bike-racing: { type: string }
            roulette: { type: string }
            baccarat: { type: string }
            blackjack: { type: string }
            teen-patti: { type: string }
            teen-patti-live: { type: string }
            sic-bo: { type: string }
            andar-bahar: { type: string }
            lucky-7: { type: string }
    WalletLedgerEntry:
      type: object
      required: [id, walletId, userId, type, amount, balanceAfter, createdAt]
      properties:
        id: { type: string }
        walletId: { type: string }
        userId: { type: string }
        type:
          type: string
          enum: [deposit, withdraw, bet, win, bonus, adjustment, refund, commission]
        amount: { type: string }
        balanceAfter: { type: string }
        refType: { type: string, nullable: true }
        refId: { type: string, nullable: true }
        memo: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    WalletTransactionsPage:
      type: object
      required: [entries]
      properties:
        scope:
          type: string
          enum: [lunar, mines, plinko, dice, aviator, jetx, fury, horse-racing, bike-racing, roulette, baccarat, blackjack, teen-patti, teen-patti-live, sic-bo, andar-bahar, lucky-7]
        entries:
          type: array
          items: { $ref: "#/components/schemas/WalletLedgerEntry" }
        nextCursor: { type: string, nullable: true }
    KycUploadResponse:
      type: object
      required: [key, size]
      properties:
        key: { type: string, description: Server-issued storage key. }
        size: { type: integer }
        contentType: { type: string, nullable: true }
    KycSubmissionInput:
      type: object
      required: [fullName, documentType, documentNumber, idDocumentKey, selfieKey]
      properties:
        fullName: { type: string, minLength: 2, maxLength: 128 }
        documentType:
          type: string
          enum: [passport, drivers_license, national_id, aadhaar, pan]
        documentNumber: { type: string, minLength: 3, maxLength: 64 }
        idDocumentKey:
          type: string
          description: Object storage key of ID document upload.
        selfieKey:
          type: string
          description: Object storage key of selfie upload.
    KycSubmission:
      type: object
      required: [id, userId, fullName, documentType, status, submittedAt]
      properties:
        id: { type: string }
        userId: { type: string }
        fullName: { type: string }
        documentType: { type: string }
        documentNumber: { type: string }
        idDocumentKey: { type: string }
        selfieKey: { type: string }
        status:
          type: string
          enum: [pending, approved, rejected]
        rejectionReason: { type: string, nullable: true }
        reviewedBy: { type: string, nullable: true }
        reviewedAt: { type: string, format: date-time, nullable: true }
        submittedAt: { type: string, format: date-time }
    KycSubmissionOrNull:
      oneOf:
        - $ref: "#/components/schemas/KycSubmission"
        - type: "null"
    KycReviewInput:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        reason: { type: string, maxLength: 500 }
    GameScope:
      type: string
      enum: [lunar, mines, plinko, dice, aviator, jetx, fury, horse-racing, bike-racing, roulette, baccarat, blackjack, teen-patti, teen-patti-live, sic-bo, andar-bahar, lucky-7]
      description: |
        Legacy game attribution. Every game uses the same shared wallet;
        money deposited from any game is available across all games.
    CoinPack:
      type: object
      required: [sku, game, coins, amount, chipValue]
      properties:
        sku:
          type: string
          description: Stable human-readable catalog id, e.g. `COINS-LUNAR-500`.
        game: { $ref: "#/components/schemas/GameScope" }
        coins:
          type: integer
          description: Coins granted by the pack. Coins are 1:1 with rupees.
        amount:
          type: string
          description: Exact price in paise as a string (coins × 100).
        chipValue:
          type: integer
          description: Chip denomination this pack is sized for (coins ÷ 10).
    PaymentRequest:
      type: object
      required: [id, userId, kind, method, amount, currency, game, status, createdAt]
      properties:
        id: { type: string }
        userId: { type: string }
        kind:
          type: string
          enum: [deposit, withdraw]
        method:
          type: string
          enum: [manual, auto]
        amount:
          type: string
          description: Amount in smallest currency unit (paise) as a string.
        currency: { type: string }
        game: { $ref: "#/components/schemas/GameScope" }
        packageSku:
          type: string
          nullable: true
          description: |
            Coin-pack SKU this deposit purchased, or null for custom amounts
            and legacy rows created before the catalog existed.
        coinQuantity:
          type: integer
          nullable: true
          description: Coins granted by `packageSku`, or null when no pack was bought.
        status:
          type: string
          enum: [pending, approved, rejected, cancelled, gateway_pending]
        upiRef: { type: string, nullable: true }
        upiId: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        rejectionReason: { type: string, nullable: true }
        processedBy: { type: string, nullable: true }
        gatewayOrderId: { type: string, nullable: true }
        gatewayStatus: { type: string, nullable: true }
        processedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    DepositRequestInput:
      type: object
      required: [amount]
      properties:
        accountId: { type: string, description: Selected payment account ID; required for branch deposits. }
        accountVersion: { type: integer, minimum: 1, description: Selected branch payment account version. }
        amount:
          type: string
          description: Positive integer amount in smallest currency unit (paise).
        game:
          allOf:
            - $ref: "#/components/schemas/GameScope"
          default: lunar
          description: Legacy game attribution; this deposit credits the shared wallet.
        packageSku:
          type: string
          minLength: 3
          maxLength: 64
          description: |
            Coin-pack SKU being purchased. Optional — omit for a custom amount.
            When present the server re-prices the SKU from its own catalog and
            rejects the request unless the SKU exists, belongs to `game`, and
            its price equals `amount`.
        coinQuantity:
          type: integer
          minimum: 1
          description: |
            Coins the client expects from `packageSku`. Optional; validated
            against the catalog and never used as the source of truth.
        upiRef: { type: string, minLength: 4, maxLength: 64 }
        notes: { type: string, maxLength: 200 }
    AutoDepositInput:
      type: object
      required: [amount]
      properties:
        amount:
          type: string
          description: Positive integer amount in smallest currency unit (paise).
        game:
          allOf:
            - $ref: "#/components/schemas/GameScope"
          default: lunar
          description: Legacy game attribution; this deposit credits the shared wallet.
        packageSku:
          type: string
          minLength: 3
          maxLength: 64
          description: |
            Coin-pack SKU being purchased. Optional — omit for a custom amount.
            Validated against the server-owned catalog exactly as for manual
            deposits.
        coinQuantity:
          type: integer
          minimum: 1
          description: Coins the client expects from `packageSku`. Optional.
        notes: { type: string, maxLength: 200 }
    AutoDepositResponse:
      allOf:
        - $ref: "#/components/schemas/PaymentRequest"
        - type: object
          properties:
            upiDeepLink: { type: string, nullable: true }
            qrData: { type: string, nullable: true }
            gatewayOrderId: { type: string, nullable: true }
    GatewayWebhookInput:
      type: object
      required: [paymentId, status, gatewayRef, signature]
      properties:
        paymentId: { type: string }
        status: { type: string, enum: [success, failed] }
        gatewayRef: { type: string }
        signature: { type: string }
    WithdrawRequestInput:
      type: object
      required: [amount, upiId]
      properties:
        amount:
          type: string
          description: Positive integer amount in smallest currency unit (paise).
        upiId: { type: string, minLength: 4, maxLength: 64 }
        notes: { type: string, maxLength: 200 }
    Bet:
      type: object
      required: [id, userId, gameCode, stakeAmount, payoutAmount, status, placedAt]
      properties:
        id: { type: string }
        userId: { type: string }
        gameCode: { type: string }
        roundId: { type: string, nullable: true }
        stakeAmount: { type: string }
        payoutAmount: { type: string }
        multiplier: { type: number, nullable: true }
        status:
          type: string
          enum: [placed, won, lost, voided, cashed_out]
        placedAt: { type: string, format: date-time }
        settledAt: { type: string, format: date-time, nullable: true }
    BetsPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/Bet" }
        nextCursor: { type: string, nullable: true }
    PlaceBetInput:
      type: object
      required: [gameCode, stakeAmount]
      properties:
        panel: { type: integer, minimum: 0, maximum: 3, description: "JetX accepts panels 0?3; other crash games accept 0?1." }
        autoCashOut: { type: number, minimum: 1.01, maximum: 1000 }
        gameCode: { type: string, minLength: 1, maxLength: 32 }
        stakeAmount:
          type: string
          description: Positive integer stake in smallest currency unit (paise).
        roundId: { type: string, maxLength: 64 }
        useBonus: { type: boolean }
        useFreeBet:
          type: boolean
          description: Consume one promotional free bet; stake is forced to the grant's fixed amount server-side.
    CashOutInput:
      type: object
      required: [multiplier]
      properties:
        multiplier: { type: number, minimum: 1.0, maximum: 100000 }
    FreeBetGrant:
      type: object
      required:
        [id, userId, gameCode, amountPaise, totalCount, remainingCount, source, expiresAt, createdAt]
      properties:
        id: { type: string }
        userId: { type: string }
        gameCode: { type: string }
        amountPaise: { type: string }
        totalCount: { type: integer }
        remainingCount: { type: integer }
        source: { type: string, enum: [admin, rain] }
        expiresAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    FreeBetsSummary:
      type: object
      required: [count, nextAmountPaise, grants]
      properties:
        count: { type: integer }
        nextAmountPaise:
          type: string
          description: Stake of the next free bet (oldest active grant), in paise. "0" when none.
        grants:
          type: array
          items: { $ref: "#/components/schemas/FreeBetGrant" }
    RainEvent:
      type: object
      required:
        [id, gameCode, amountPaise, betsPerClaim, maxClaims, claimedCount, message, expiresAt, createdAt]
      properties:
        id: { type: string }
        gameCode: { type: string }
        amountPaise: { type: string }
        betsPerClaim: { type: integer }
        maxClaims: { type: integer }
        claimedCount: { type: integer }
        message: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    AdminGrantFreeBetsInput:
      type: object
      required: [userId, amountPaise, count]
      properties:
        userId: { type: string, minLength: 1 }
        gameCode: { type: string, minLength: 1, maxLength: 32 }
        amountPaise: { type: string, description: Stake per free bet in paise. }
        count: { type: integer, minimum: 1, maximum: 1000 }
        expiresInHours: { type: integer, minimum: 1, maximum: 2160 }
    AdminCreateRainInput:
      type: object
      required: [amountPaise, maxClaims]
      properties:
        amountPaise: { type: string, description: Free-bet stake per claimer in paise. }
        betsPerClaim: { type: integer, minimum: 1, maximum: 20 }
        maxClaims: { type: integer, minimum: 1, maximum: 500 }
        message: { type: string, maxLength: 200 }
        ttlSeconds: { type: integer, minimum: 15, maximum: 3600 }
    SettleLossInput:
      type: object
      properties:
        multiplier: { type: number, minimum: 1.0, maximum: 100000 }
    WalletAdjustInput:
      type: object
      required: [userId, amount, memo]
      properties:
        userId: { type: string }
        amount:
          type: string
          description: Signed integer in smallest unit (paise). Positive credits, negative debits.
        memo: { type: string, minLength: 1, maxLength: 200 }
        game:
          type: string
          enum: [lunar, mines, plinko, dice, aviator, jetx, fury, horse-racing, bike-racing, roulette, baccarat, blackjack, teen-patti, teen-patti-live, sic-bo, andar-bahar, lucky-7]
          default: lunar
          description: Legacy game attribution; adjustments apply to the shared wallet.
        type:
          type: string
          enum: [adjustment, bonus, refund]
          default: adjustment
    AdminCleanupDemoAccountsInput:
      type: object
      required: [thresholdHours]
      properties:
        thresholdHours:
          type: integer
          minimum: 0
          maximum: 8760
          description: Minimum idle hours since last activity. Use 0 to purge all demo accounts.
    AdminCleanupDemoAccountsResult:
      type: object
      required: [deleted, thresholdHours]
      properties:
        deleted: { type: integer, description: Number of demo accounts removed }
        thresholdHours: { type: integer }
    DemoCleanupHistoryEntry:
      type: object
      required: [id, createdAt, deleted, thresholdHours]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        actorId: { type: string, nullable: true }
        actorEmail: { type: string, nullable: true, description: "Null when triggered by the scheduler." }
        deleted: { type: integer }
        thresholdHours: { type: integer }
    AdminUsersPage:
      type: object
      required: [users, total]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/UserPublic" }
        total: { type: integer }
    AuditLogEntry:
      type: object
      required: [id, action, createdAt]
      properties:
        id: { type: string }
        actorId: { type: string, nullable: true }
        actorRole: { type: string, nullable: true }
        action: { type: string }
        targetType: { type: string, nullable: true }
        targetId: { type: string, nullable: true }
        before: {}
        after: {}
        ip: { type: string, nullable: true }
        userAgent: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    AdminBetsPage:
      type: object
      required: [bets, total]
      properties:
        bets:
          type: array
          items: { $ref: "#/components/schemas/Bet" }
        total: { type: integer }
    AdminRoundDetail:
      type: object
      required: [roundId, bets, totals]
      properties:
        roundId: { type: string }
        bets:
          type: array
          items: { $ref: "#/components/schemas/Bet" }
        totals:
          type: object
          required: [count, stakeAmount, payoutAmount]
          properties:
            count: { type: integer }
            stakeAmount: { type: string }
            payoutAmount: { type: string }
    Withdrawal:
      type: object
      required: [id, userId, amount, currency, method, destination, status, kind, manualSettlement, requestedAt]
      properties:
        id: { type: string }
        userId: { type: string }
        amount: { type: string }
        currency: { type: string }
        method: { type: string }
        destination: { type: string }
        kind: { type: string }
        status:
          type: string
          enum: [pending, approved, rejected, paid, failed]
        rejectionReason: { type: string, nullable: true }
        gatewayPayoutId: { type: string, nullable: true }
        gatewayStatus: { type: string, nullable: true }
        utr: { type: string, nullable: true }
        manualSettlement: { type: boolean }
        reviewedBy: { type: string, nullable: true }
        reviewedAt: { type: string, format: date-time, nullable: true }
        paidAt: { type: string, format: date-time, nullable: true }
        requestedAt: { type: string, format: date-time }
    MarkPaidInput:
      type: object
      required: [utr]
      properties:
        utr: { type: string, minLength: 4, maxLength: 64 }
    DepositDecisionInput:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        reason: { type: string, maxLength: 500 }
    UpiAccount:
      type: object
      required: [id, label, upiId, qrUrl, active, sortOrder, createdAt, updatedAt]
      properties:
        id: { type: string }
        label: { type: string }
        upiId: { type: string }
        qrUrl: { type: string, nullable: true }
        active: { type: boolean }
        sortOrder: { type: integer }
        createdBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PublicUpiAccount:
      type: object
      required: [id, label, upiId, qrUrl]
      properties:
        id: { type: string }
        label: { type: string }
